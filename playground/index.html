<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DzGrid playground</title>
  <style>
    body { margin: 0; padding: 1rem; font: 14px system-ui, sans-serif; background: var(--tz-bg); color: var(--tz-fg); color-scheme: var(--tz-color-scheme, light dark); }
    .bar { display: flex; flex-wrap: wrap; gap: .5rem 1rem; align-items: center; margin-block-end: .75rem; }
    #host { block-size: 70vh; }
    #host > .dzg { block-size: 100%; }
    output { color: var(--tz-fg-muted); }
  </style>
</head>
<body>
  <h1>DzGrid</h1>
  <form class="bar" id="controls">
    <label>Langue <select name="locale"><option>fr-FR</option><option>en-US</option><option>ar-DZ</option></select></label>
    <label>Sens <select name="direction"><option value="auto">auto</option><option>ltr</option><option>rtl</option></select></label>
    <label>Thème <select name="theme"><option value="">système</option><option>light</option><option>dark</option></select></label>
    <label>Contraste <select name="contrast"><option value="">normal</option><option value="more">renforcé</option></select></label>
    <label>Densité <select name="density"><option>comfortable</option><option>compact</option><option>spacious</option></select></label>
    <label>Lignes <select name="rows"><option value="100000">100 000 (jeu A)</option><option value="1000000">1 000 000</option></select></label>
    <label>Sélection <select name="selection"><option>multi</option><option>single</option><option>none</option></select></label>
    <label><input type="checkbox" name="box" checked> cases</label>
    <label><input type="checkbox" name="warm"> recherche préparée</label>
    <button type="button" data-overlay="loading">Chargement</button>
    <button type="button" data-overlay="error">Erreur</button>
    <button type="button" data-overlay="">Aucun</button>
    <output id="status"></output>
  </form>
  <div id="host"></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
