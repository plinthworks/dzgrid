<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DzGrid</title>
  <style>
    body { margin: 0; padding: 1rem; font: 14px system-ui, sans-serif; background: var(--tz-bg); color: var(--tz-fg); color-scheme: var(--tz-color-scheme, light dark); max-inline-size: 1100px; }
    .bar { display: flex; flex-wrap: wrap; gap: .5rem 1rem; align-items: center; margin-block: .5rem .75rem; }
    #host { block-size: 60vh; }
    #host > .dzg { block-size: 100%; }
    .note { margin-block: .25rem .5rem; color: var(--tz-fg-muted); line-height: 1.45; max-inline-size: 90ch; }
    a { color: var(--tz-accent); }
    .hint { margin-inline-start: 1.5rem; color: var(--tz-fg-muted); }
    .steps { margin-block: .25rem .75rem; padding-inline-start: 1.25rem; line-height: 1.5; max-inline-size: 80ch; }
    .log { margin-block-start: .75rem; }
    .log h2 { font-size: 1rem; margin-block: 0 .25rem; }
    .log ol { margin: 0; padding-inline-start: 1.25rem; color: var(--tz-fg-muted); line-height: 1.5; }
    .log li:first-child { color: var(--tz-fg); }
  </style>
</head>
<body data-demo="orders-edit">
  <!-- #hint: the way to the selection demo (?focus=range), on the nav line so the grid does not move (the checks click rows in a 900 px window); its words set by page.ts. -->
  <nav><a href="./index.html">← Démos</a> <span class="hint" id="hint"></span></nav>
  <h1 id="title"></h1>
  <ul class="steps" id="steps"></ul>
  <form class="bar" id="controls">
    <label>Langue <select name="locale"><option value="fr-FR">français</option><option value="ar-DZ">arabe (droite à gauche)</option></select></label>
    <label>Thème <select name="theme"><option value="">système</option><option>light</option><option>dark</option></select></label>
    <label>Thème vitrine <select name="skin"><option value="none">aucun</option><option>midnight</option><option>clinic</option></select></label>
    <!-- Step 7: Enter's move (owner Q3 revised: stays by default) and the server-paged mode; their words set by page.ts (fr / ar). -->
    <label><span id="enter-label">Entrée</span> <select name="enter"><option value="stay">reste</option><option value="down">descend</option></select></label>
    <label><span id="paged-label">Données</span> <select name="paged"><option value="">dans le navigateur</option><option value="1">serveur paginé</option></select></label>
    <!-- Step 8: the sub-orders as child rows (an editable tree); its words set by page.ts. -->
    <label><span id="tree-label">Forme</span> <select name="tree"><option value="">liste</option><option value="1">arbre</option></select></label>
  </form>
  <!-- Live switches (no reload): animations, the network cut, a row removed in 3 s, the next page in 3 s. -->
  <div class="bar" id="live"></div>
  <main>
    <div id="host"></div>
    <section class="log" aria-labelledby="log-title">
      <h2 id="log-title"></h2>
      <!-- role="log" with aria-live="off": the grid already says each refusal (assertive) and each toggle; a live log would say them twice. -->
      <ol id="log" role="log" aria-live="off"></ol>
    </section>
  </main>
  <script type="module" src="./demos/page.ts"></script>
</body>
</html>
