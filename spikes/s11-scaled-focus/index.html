<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>S11 scaled focus</title>
<style>
  :root { --s-bg: #fff; --s-fg: #1a1a1a; --s-line: #8a8a8a; --s-head: #eef0f3; --s-focus: #0b57d0; --s-pin: #f6f7f9; }
  body { margin: 16px; background: var(--s-bg); color: var(--s-fg); font: 13px system-ui, sans-serif; }
  input.mark { display: block; margin-block: 8px; }
  .vp { inline-size: 800px; block-size: 600px; overflow: auto; position: relative; border: 1px solid var(--s-line); }
  .head, .row { display: flex; inline-size: 2700px; block-size: 32px; }
  .head { position: sticky; inset-block-start: 0; z-index: 3; background: var(--s-head); }
  .body { position: relative; inline-size: 2700px; }
  .vp[data-clip="1"] .body { overflow: clip; }
  .layer { position: absolute; inset-inline-start: 0; inline-size: 2700px; }
  .row { position: absolute; inset-inline-start: 0; background: var(--s-bg); }
  .seg { display: flex; }
  .seg.start { position: sticky; inset-inline-start: 0; z-index: 2; background: var(--s-pin); }
  .seg.end { position: sticky; inset-inline-end: 0; z-index: 2; background: var(--s-pin); }
  .c { box-sizing: border-box; inline-size: 120px; padding-inline: 6px; line-height: 31px; border-block-end: 1px solid var(--s-line); white-space: nowrap; overflow: hidden; }
  .seg.start .c, .seg.end .c { inline-size: 100px; }
  .c:focus { outline: 2px solid var(--s-focus); outline-offset: -2px; }
  .c input { inline-size: 100%; box-sizing: border-box; }
</style></head>
<body>
<main>
  <h1>S11</h1>
  <input class="mark" id="before" aria-label="before">
  <div id="host"></div>
  <input class="mark" id="after" aria-label="after">
</main>
<script type="module" src="./page.ts"></script>
</body>
</html>
