<!doctype html>

<head>
<meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DzGrid browser suite: 1.12.1 the columns panel and narrow headers</title>
<script type="importmap">{ "imports": {
  "@dzgrid/core": "/packages/core/src/index.ts",
  "@dzgrid/core/internal": "/packages/core/src/internal.ts",
  "@dzgrid/core/dock": "/packages/core/src/dock.ts",
  "@dzgrid/dom/internal": "/packages/dom/src/internal.ts"
} }</script>
<script>
  // The sheets by the query (scripts/browser-1-12.mjs (12)): Tailwind 3's preflight first (an unlayered reset, as the
  // owner's app has), then the layered or unlayered copies.
  {
    const q = new URLSearchParams(location.search);
    const u = q.get('css') === 'unlayered' ? '.unlayered' : '';
    const sheets = [...(q.get('preflight') ? ['/node_modules/tailwindcss3/src/css/preflight.css'] : []), ...['dzgrid', 'columns', 'menu', 'columns-panel', 'dock', 'variables', 'buttons'].map((f) => `/packages/theme/${f}${u}.css`)];
    for (const href of sheets) document.write(`<link rel="stylesheet" href="${href}">`);
  }
</script>
<style>
  body { margin: 16px; font: 14px system-ui, sans-serif; background: var(--tz-bg); color: var(--tz-fg); }
  #host { inline-size: 1100px; block-size: 520px; display: flex; flex-direction: column; }
  #host > .dzg { flex: 1 1 auto; }
</style>
</head>
<body>
<main><h1>DzGrid</h1><div id="host"></div></main>
<script type="module" src="./v1-12-1.ts"></script>
